[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "simulate-china-stocks"
version = "0.1.0"
description = "日终 A 股前向模拟：独立数据、多账户账本与规则模拟执行"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["baostock==0.9.4"]

[project.scripts]
china-stock-sim = "china_stock_sim.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/china_stock_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
