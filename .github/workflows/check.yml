name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.7.6
          uv sync --locked --group dev
      - name: Inspect repository history for secrets
        run: .venv/bin/python scripts/check_secrets.py --history HEAD
      - name: Check source and offline tests
        run: |
          .venv/bin/ruff check .
          .venv/bin/python -m pytest -q --durations=20
